<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PURU CHAIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--text:#5a2a4a;--pink:#ff6fa5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--text);background:#bfe9ff url("a.jpg") center/cover no-repeat;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#sa{position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.45);padding:16px;z-index:10}
#card{width:min(100%,460px);padding:28px 20px;text-align:center;background:#fff;border:5px solid #ff8fb8;border-radius:30px;
  box-shadow:0 8px 0 #ffc2da,0 16px 30px rgba(255,111,165,.35);display:flex;flex-direction:column;gap:16px;align-items:center}
#title{font-size:clamp(30px,10vw,46px);font-weight:900;letter-spacing:.04em;color:#ff5a8a;text-shadow:0 4px 0 #ffc2da}
#sub{font-size:14px;line-height:1.8;color:#7a4a6a;font-weight:700}
.lv{display:flex;gap:8px;width:100%}
.lv button{flex:1;font:inherit;font-weight:900;font-size:14px;padding:12px 0;border:3px solid #ffb3ce;border-radius:16px;background:#fff;color:#c4688f;cursor:pointer}
.lv button:nth-child(1){border-color:#4cd964;color:#25a845}
.lv button:nth-child(2){border-color:#4aa3ff;color:#2a73d6}
.lv button:nth-child(3){border-color:#ff5a5a;color:#d93030}
.lv button.on{color:#fff!important}
.lv button:nth-child(1).on{background:#4cd964;box-shadow:0 4px 0 #25a845}
.lv button:nth-child(2).on{background:#4aa3ff;box-shadow:0 4px 0 #2a73d6}
.lv button:nth-child(3).on{background:#ff5a5a;box-shadow:0 4px 0 #d93030}
#bgmBtn{font:inherit;font-weight:900;font-size:14px;padding:8px 22px;border:3px solid #ffd23f;border-radius:50px;background:#fff8dc;color:#b08000;cursor:pointer}
#start{width:100%;font:inherit;font-weight:900;font-size:22px;padding:16px;border:0;border-radius:50px;color:#fff;cursor:pointer;
  background:linear-gradient(90deg,#ff5a5a,#ffb020,#4cd964,#4aa3ff,#b56cff);box-shadow:0 6px 0 #7a4a9a;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#start:active{transform:translateY(4px);box-shadow:0 2px 0 #7a4a9a}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="sa"></div>
<div id="overlay"><div id="card">
  <div id="title"><span style="color:#ff5a5a">P</span><span style="color:#ff9f1c">U</span><span style="color:#ffd23f">R</span><span style="color:#4cd964">U</span> <span style="color:#4aa3ff">C</span><span style="color:#b56cff">H</span><span style="color:#ff5aa5">A</span><span style="color:#ff5a5a">I</span><span style="color:#4aa3ff">N</span></div>
  <div id="sub">2個1組のプルンが落ちてくる。同じ色を4つ以上くっつけると消えるよ！<br>消えたあとに上のプルンが落ちて、さらに消える「連鎖」を狙おう。<br>
  <b>ドラッグ</b>: 左右移動 ／ <b>タップ</b>: 回転 ／ <b>下フリック</b>: 即落下<br>（PC: ← → ↑ ↓ / Space）</div>
  <div class="lv" id="lv">
    <button data-l="easy">かんたん</button><button data-l="normal" class="on">ふつう</button><button data-l="hard">むずかしい</button>
  </div>
  <button id="start">スタート！</button>
  <button id="bgmBtn" type="button">♪ BGM: ON</button>
</div></div>

<script>
(() => {
  const COLS = 6, ROWS = 12;
  const COLORS = ["", "#ff5a5a", "#4aa3ff", "#4cd964", "#ffd23f", "#b56cff"];
  // n: 色の数（多いほど連鎖が作りにくい）／ t: 落下間隔(ms)
  const LEVELS = {easy:{n:3, t:900}, normal:{n:4, t:700}, hard:{n:5, t:520}};
  const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  const SAT = [[-1,0],[0,1],[1,0],[0,-1]];   // 子コアの位置：上・右・下・左
  const BTN = ["◀", "⟳", "▼", "▶"], BTNC = ["#4aa3ff", "#4cd964", "#ffb020", "#ff5a8a"];

  let level = "normal";
  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d"), ov = $("overlay"), sa = $("sa");
  const title = $("title"), sub = $("sub"), startBtn = $("start"), lvBox = $("lv");
  const markLevel = () => [...lvBox.children].forEach(b => b.classList.toggle("on", b.dataset.l === level));
  lvBox.addEventListener("click", e => { const l = e.target.dataset && e.target.dataset.l; if (l){ level = l; markLevel(); } });

  // BGMファイル（index.html と同じフォルダに置く）。複数書くとゲーム開始ごとにランダムで選ばれる
  const BGM_FILES = ["bgm.mp3"];
  const bgm = new Audio(); bgm.loop = true; bgm.volume = 0.6; bgm.preload = "auto";
  let bgmOn = true; const bgmBtn = $("bgmBtn");
  bgmBtn.addEventListener("click", () => { bgmOn = !bgmOn; bgmBtn.textContent = "♪ BGM: " + (bgmOn ? "ON" : "OFF"); if (!bgmOn) bgm.pause(); });
  function bgmPlay(){
    if (!bgmOn) return;
    try { bgm.src = BGM_FILES[Math.floor(Math.random() * BGM_FILES.length)]; bgm.currentTime = 0; bgm.play().catch(() => {}); } catch(e){}
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) bgm.pause();
    else if (bgmOn && (phase === "fall" || phase === "gravity" || phase === "clear")) bgm.play().catch(() => {});
  });

  let grid, piece, queue, phase = "idle", score, chain, maxChain, pieces, best = 0;
  let lastDrop = 0, lastStep = 0, clearAt = 0, clearSet = [], popup = {t:"", at:-1e9};
  let held = new Map(), gest = new Map(), keySoft = false;
  let L = {};

  const rnd = () => 1 + Math.floor(Math.random() * LEVELS[level].n);
  const bestKey = () => "chaincore_best_" + level;
  const loadBest = () => { try { best = parseInt(localStorage.getItem(bestKey()), 10) || 0; } catch(e){ best = 0; } };
  const saveBest = () => { try { localStorage.setItem(bestKey(), best); } catch(e){} };

  function layout(){
    const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cs = getComputedStyle(sa), st = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
    const top = st + 84, btnH = 64;
    const cell = Math.floor(Math.min((H - sb - top - btnH - 24) / ROWS, (Math.min(W, 480) - 20) / COLS));
    const bx = Math.round((W - cell * COLS) / 2), by = top, bb = by + cell * ROWS;
    const bw = Math.max(cell * COLS, Math.min(W - 20, 440));
    L = {W, H, st, cell, bx, by, bb, btnY:bb + 12, btnH, btnX:(W - bw) / 2, btnW:bw / 4};
  }
  addEventListener("resize", layout);
  addEventListener("orientationchange", () => setTimeout(layout, 200));

  const free = (r, c) => c >= 0 && c < COLS && r >= 0 && r < ROWS && !grid[r][c];
  const sat = p => ({r:p.r + SAT[p.o][0], c:p.c + SAT[p.o][1]});
  const valid = p => { const s = sat(p); return free(p.r, p.c) && free(s.r, s.c); };

  function begin(){
    layout(); loadBest();
    grid = Array.from({length:ROWS}, () => Array(COLS).fill(0));
    queue = []; score = 0; chain = 0; maxChain = 0; pieces = 0; clearSet = []; held.clear(); gest.clear();
    popup = {t:"", at:-1e9};
    ov.hidden = true; lvBox.hidden = true;
    bgmPlay();
    spawn(performance.now());
  }
  function spawn(now){
    while (queue.length < 3) queue.push({a:rnd(), b:rnd()});
    const q = queue.shift();
    piece = {c:2, r:1, o:0, a:q.a, b:q.b};
    pieces++; lastDrop = now; phase = "fall";
    if (!valid(piece)) finish();
  }
  function finish(){
    phase = "over"; piece = null; try { bgm.pause(); } catch(e){}
    if (score > best){ best = score; saveBest(); }
    title.textContent = "ゲームオーバー";
    sub.innerHTML = "スコア " + score + "<br>ベスト " + best + "<br>最大連鎖 " + maxChain;
    startBtn.textContent = "もう一回！"; lvBox.hidden = false; ov.hidden = false;
  }

  const dropT = () => Math.max(130, LEVELS[level].t - Math.floor(pieces / 6) * 20);
  function tryMove(dc){ const np = {...piece, c:piece.c + dc}; if (valid(np)){ piece = np; return true; } return false; }
  function rotate(d){
    const np = {...piece, o:(piece.o + d + 4) % 4};
    if (valid(np)){ piece = np; return; }
    for (const [dc, dr] of [[-1,0],[1,0],[0,-1]]){
      const k = {...np, c:np.c + dc, r:np.r + dr};
      if (valid(k)){ piece = k; return; }
    }
  }
  function hardDrop(now){
    while (valid({...piece, r:piece.r + 1})) piece.r++;
    lock(now);
  }
  function lock(now){
    const s = sat(piece);
    grid[piece.r][piece.c] = piece.a; grid[s.r][s.c] = piece.b;
    piece = null; chain = 0; phase = "gravity"; lastStep = now;
  }
  function stepGravity(){
    let moved = false;
    for (let c = 0; c < COLS; c++)
      for (let r = ROWS - 2; r >= 0; r--)
        if (grid[r][c] && !grid[r + 1][c]){ grid[r + 1][c] = grid[r][c]; grid[r][c] = 0; moved = true; }
    return moved;
  }
  function findGroups(now){
    const seen = Array.from({length:ROWS}, () => Array(COLS).fill(false)), out = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
      if (!grid[r][c] || seen[r][c]) continue;
      const col = grid[r][c], stack = [[r, c]], cells = []; seen[r][c] = true;
      while (stack.length){
        const [y, x] = stack.pop(); cells.push([y, x]);
        for (const [dy, dx] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const ny = y + dy, nx = x + dx;
          if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS && !seen[ny][nx] && grid[ny][nx] === col){ seen[ny][nx] = true; stack.push([ny, nx]); }
        }
      }
      if (cells.length >= 4) out.push(...cells);
    }
    if (!out.length){ spawn(now); return; }
    clearSet = out; chain++; maxChain = Math.max(maxChain, chain); clearAt = now; phase = "clear";
    if (chain >= 2) popup = {t:chain + " れんさ！", at:now};
  }
  function doClear(now){
    for (const [r, c] of clearSet) grid[r][c] = 0;
    score += clearSet.length * 10 * chain * chain;
    clearSet = []; phase = "gravity"; lastStep = now;
  }

  function update(now){
    if (phase === "fall" && piece){
      for (const h of held.values()) if ((h.b === 0 || h.b === 3) && now >= h.next){ tryMove(h.b === 0 ? -1 : 1); h.next = now + 70; }
      const soft = keySoft || [...held.values()].some(h => h.b === 2);
      if (now - lastDrop >= (soft ? 40 : dropT())){
        lastDrop = now;
        const np = {...piece, r:piece.r + 1};
        if (valid(np)){ piece = np; if (soft) score++; } else lock(now);
      }
    } else if (phase === "gravity"){
      if (now - lastStep >= 55){ lastStep = now; if (!stepGravity()) findGroups(now); }
    } else if (phase === "clear" && now - clearAt >= 380) doClear(now);
  }

  let T = 0;
  const DARK = ["", "#d93030", "#2a73d6", "#25a845", "#e0a800", "#8a45d6"];
  const rrect = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); };

  // ぷるぷるした目つきのプルン
  function orb(x, y, r, v, a = 1, white = false){
    const w = Math.sin(T / 220 + x * .05) * .035, rx = r * (1 + w), ry = r * (1 - w);
    ctx.globalAlpha = a;
    if (white) ctx.fillStyle = "#fff";
    else {
      const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .08, x, y, r * 1.1);
      g.addColorStop(0, "#fff"); g.addColorStop(.22, COLORS[v]); g.addColorStop(1, DARK[v]);
      ctx.fillStyle = g;
    }
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
    if (!white) for (const s of [-1, 1]){
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(x + s * r * .32, y + r * .05, r * .2, r * .26, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#2b1030"; ctx.beginPath(); ctx.arc(x + s * r * .32, y + r * .1, r * .1, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw(now){
    T = now;
    const {W, H, st, cell, bx, by, bb} = L, R = cell * .44, bwid = cell * COLS;
    ctx.clearRect(0, 0, W, H);

    // 盤面
    const rb = ctx.createLinearGradient(bx, by, bx + bwid, bb);
    ["#ff5a5a", "#ffb020", "#ffd23f", "#4cd964", "#4aa3ff", "#b56cff"].forEach((c, i, a) => rb.addColorStop(i / (a.length - 1), c));
    rrect(bx - 7, by - 7, bwid + 14, cell * ROWS + 14, 18); ctx.fillStyle = rb; ctx.fill();
    rrect(bx, by, bwid, cell * ROWS, 12); ctx.fillStyle = "rgba(255,255,255,.88)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,143,184,.22)"; ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++){ ctx.beginPath(); ctx.moveTo(bx + i * cell, by); ctx.lineTo(bx + i * cell, bb); ctx.stroke(); }
    for (let i = 1; i < ROWS; i++){ ctx.beginPath(); ctx.moveTo(bx, by + i * cell); ctx.lineTo(bx + bwid, by + i * cell); ctx.stroke(); }

    const cx = c => bx + c * cell + cell / 2, cy = r => by + r * cell + cell / 2;
    const clearing = new Set(clearSet.map(([r, c]) => r * COLS + c));
    // くっつき表示
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
      const v = grid[r][c]; if (!v) continue;
      ctx.fillStyle = COLORS[v];
      if (c + 1 < COLS && grid[r][c + 1] === v) ctx.fillRect(cx(c), cy(r) - R * .62, cell, R * 1.24);
      if (r + 1 < ROWS && grid[r + 1][c] === v) ctx.fillRect(cx(c) - R * .62, cy(r), R * 1.24, cell);
    }
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
      const v = grid[r][c]; if (!v) continue;
      const hit = clearing.has(r * COLS + c) && Math.floor(now / 70) % 2;
      orb(cx(c), cy(r), R, v, 1, !!hit);
    }
    // 操作中のプルンと落下予想
    if (piece){
      let g = {...piece}; while (valid({...g, r:g.r + 1})) g.r++;
      if (g.r !== piece.r){
        const gs = sat(g); ctx.lineWidth = 3;
        for (const [p, v] of [[g, piece.a], [gs, piece.b]]){
          ctx.strokeStyle = COLORS[v]; ctx.globalAlpha = .6; ctx.setLineDash([6, 5]);
          ctx.beginPath(); ctx.arc(cx(p.c), cy(p.r), R, 0, 7); ctx.stroke();
        }
        ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.lineWidth = 1;
      }
      const s = sat(piece);
      orb(cx(piece.c), cy(piece.r), R, piece.a); orb(cx(s.c), cy(s.r), R, piece.b);
      ctx.strokeStyle = "rgba(90,42,74,.55)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx(piece.c), cy(piece.r), R + 3, 0, 7); ctx.stroke(); ctx.lineWidth = 1;
    }

    // HUD
    rrect(bx, st + 6, bwid - 108, 72, 14); ctx.fillStyle = "#fffbe6"; ctx.fill(); ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 1;
    ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
    ctx.fillStyle = "#c4688f"; ctx.font = "900 13px " + FONT; ctx.fillText("スコア（" + ({easy:"かんたん", normal:"ふつう", hard:"むずかしい"})[level] + "）", bx + 12, st + 22);
    ctx.fillStyle = "#5a2a4a"; ctx.font = "900 32px " + FONT; ctx.fillText(score || 0, bx + 12, st + 56);
    ctx.fillStyle = "#c4688f"; ctx.font = "700 11px " + FONT; ctx.fillText("ベスト " + best + " / 最大連鎖 " + maxChain, bx + 12, st + 74);
    // NEXT
    const nx = bx + bwid - 100, ny = st + 6;
    rrect(nx, ny, 100, 72, 14); ctx.fillStyle = "#fff"; ctx.fill(); ctx.strokeStyle = "#4aa3ff"; ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 1;
    ctx.textAlign = "center"; ctx.fillStyle = "#4aa3ff"; ctx.font = "900 10px " + FONT; ctx.fillText("NEXT", nx + 50, ny + 13);
    queue.slice(0, 2).forEach((q, i) => {
      const x = nx + 30 + i * 40, rr = i ? 9 : 12;
      orb(x, ny + 22 + rr * (i ? 1.1 : 1), rr, q.b); orb(x, ny + 22 + rr * (i ? 3.1 : 3), rr, q.a);
    });

    // ボタン
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let i = 0; i < 4; i++){
      const x = L.btnX + i * L.btnW + 5, w = L.btnW - 10, down = [...held.values()].some(h => h.b === i);
      rrect(x, L.btnY + (down ? 3 : 0), w, L.btnH, 18); ctx.fillStyle = down ? BTNC[i] : "#fff"; ctx.fill();
      ctx.strokeStyle = BTNC[i]; ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = down ? "#fff" : BTNC[i]; ctx.font = "900 28px " + FONT; ctx.fillText(BTN[i], x + w / 2, L.btnY + L.btnH / 2 + (down ? 3 : 0));
    }

    // 連鎖表示
    const a = 1 - (now - popup.at) / 1000;
    if (a > 0){
      ctx.globalAlpha = a; ctx.font = "900 " + Math.round(cell * .85) + "px " + FONT;
      const py = by + cell * 5 - (1 - a) * 30;
      ctx.lineJoin = "round"; ctx.lineWidth = 9; ctx.strokeStyle = "#fff"; ctx.strokeText(popup.t, W / 2, py);
      ctx.fillStyle = "#ff5a2a"; ctx.fillText(popup.t, W / 2, py);
      ctx.globalAlpha = 1;
    }
  }

  function frame(){
    requestAnimationFrame(frame);
    const now = performance.now();
    if (phase !== "idle" && phase !== "over") update(now);
    if (L.cell) draw(now);
  }

  // 入力：下のボタン（長押し対応）／盤面ジェスチャー
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (phase !== "fall" || !piece) return;
    try { cv.setPointerCapture(e.pointerId); } catch(_){}
    if (e.clientY >= L.btnY - 6){
      const b = Math.floor((e.clientX - L.btnX) / L.btnW);
      if (b < 0 || b > 3) return;
      if (b === 1) { rotate(1); held.set(e.pointerId, {b, next:Infinity}); return; }
      if (b === 0 || b === 3) tryMove(b === 0 ? -1 : 1);
      held.set(e.pointerId, {b, next:performance.now() + 200});
    } else {
      gest.set(e.pointerId, {x:e.clientX, y:e.clientY, ax:e.clientX, t:performance.now(), moved:false});
    }
  });
  cv.addEventListener("pointermove", e => {
    const g = gest.get(e.pointerId); if (!g || !piece) return;
    const step = L.cell * .85;
    while (Math.abs(e.clientX - g.ax) >= step){
      const d = e.clientX > g.ax ? 1 : -1; tryMove(d); g.ax += d * step; g.moved = true;
    }
  });
  const release = e => {
    held.delete(e.pointerId);
    const g = gest.get(e.pointerId); gest.delete(e.pointerId);
    if (!g || e.type === "pointercancel" || phase !== "fall" || !piece) return;
    const dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (!g.moved && Math.abs(dx) < 12 && Math.abs(dy) < 12 && performance.now() - g.t < 350) rotate(1);
    else if (!g.moved && dy > L.cell * 1.6 && Math.abs(dx) < dy * .6) hardDrop(performance.now());
  };
  cv.addEventListener("pointerup", release);
  cv.addEventListener("pointercancel", release);

  addEventListener("keydown", e => {
    if (phase !== "fall" || !piece) return;
    const k = e.key;
    if (k === "ArrowLeft" || k === "a") tryMove(-1);
    else if (k === "ArrowRight" || k === "d") tryMove(1);
    else if (k === "ArrowUp" || k === "w" || k === "x") rotate(1);
    else if (k === "z") rotate(-1);
    else if (k === "ArrowDown" || k === "s") keySoft = true;
    else if (k === " ") { e.preventDefault(); if (!e.repeat) hardDrop(performance.now()); }
  });
  addEventListener("keyup", e => { if (e.key === "ArrowDown" || e.key === "s") keySoft = false; });
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("touchmove", e => e.preventDefault(), {passive:false});
  startBtn.addEventListener("click", begin);

  layout(); markLevel(); queue = []; grid = Array.from({length:ROWS}, () => Array(COLS).fill(0)); score = 0; maxChain = 0;
  frame();
})();
</script>
</body>
</html>
